[pytest]
# esp: flash and serial of the board; idf: the Unity menu and the build of this project.
# -s shows the DUT log as it runs.
addopts = --embedded-services esp,idf --target esp32s3 --build-dir build -s
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestExperimentalApiWarning
